name: Frizz Hourly
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: frizz-hourly
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python collect.py
      - name: Commit reading
        run: |
          git config user.name  "frizz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/frizz_hourly.csv
          git diff --cached --quiet || git commit -m "frizz reading"
          git push
